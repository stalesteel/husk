<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>QR-kode – Husk Klommestein</title>
<link rel="stylesheet" href="/css/base.css">
<style>
  .qr-page {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  .qr-page > p:first-child a { font-weight: 600; text-decoration: none; }

  /* Etiketten er alltid sort på hvitt, uansett mørk modus, så den kan skannes og skrives ut. */
  .qr-label {
    margin: 16px 0 24px;
    padding: 24px;
    border-radius: 16px;
    background: #ffffff;
    color: #111111;
    text-align: center;
  }
  .qr-label h1 { font-size: 1.75rem; margin: 0 0 12px; }
  .qr-label svg { display: block; width: 100%; height: auto; }
  .qr-label p { margin: 12px 0 0; color: #555555; }

  .qr-page .button + .button { margin-top: 12px; }
  .url { margin-top: 20px; font-size: 0.875rem; word-break: break-all; }

  @media print {
    body { background: #ffffff; }
    .no-print { display: none !important; }
    .qr-page { padding: 0; }
    .qr-label { margin: 0; padding: 0; }
  }
</style>
</head>
<body>
  <main class="qr-page">
    <p class="no-print"><a id="back" href="/">‹ Tilbake</a></p>
    <p id="message" class="muted">Et øyeblikk …</p>
    <div id="content" hidden>
      <div class="qr-label">
        <h1 id="name"></h1>
        <div id="code"></div>
        <p id="caption"></p>
      </div>
      <div class="no-print">
        <button id="print" class="button" type="button">Skriv ut</button>
        <button id="download" class="button secondary" type="button">Last ned som bilde</button>
        <p id="url" class="url muted"></p>
      </div>
    </div>
  </main>
  <script type="module" src="/js/qr.js"></script>
</body>
</html>
