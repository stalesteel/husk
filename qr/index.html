<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>QR-kode – Husk Klommestein</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/plakat.css">
<style>
  .qr-track .dp-track { --slide-w: min(62vw, 280px); }
  .qr-actions { max-width: 560px; margin: 18px auto 0; padding: 0 16px; }
  .qr-actions .button + .button { margin-top: 12px; }
  .url { margin-top: 18px; font-size: 0.875rem; word-break: break-all; text-align: center; }
  #print-sheet { display: none; }

  /* Utskrift: bare merket, i riktig størrelse (7 × 9 cm). */
  @media print {
    @page { margin: 12mm; }
    body { background: #ffffff; }
    .pl { display: none; }
    #print-sheet { display: block; }
    #print-sheet img { display: block; width: 70mm; height: 90mm; }
  }
</style>
</head>
<body>
  <main class="pl">
    <nav class="pl-top">
      <a id="back" href="/">‹ Tilbake</a>
      <h1>QR-kode</h1>
    </nav>
    <p id="message" class="muted pl-message">Et øyeblikk …</p>

    <div id="content" hidden>
      <div id="picker" class="qr-track"></div>
      <div class="pl-design" aria-live="polite">
        <strong id="design-name"></strong>
        <span id="design-count"></span>
      </div>
      <div class="qr-actions">
        <button id="print" class="button" type="button">Skriv ut</button>
        <button id="download" class="button secondary" type="button">Last ned som bilde</button>
        <p class="pl-note">Merket er 7 × 9 cm når det skrives ut.</p>
        <p id="url" class="url muted"></p>
      </div>
    </div>
  </main>
  <div id="print-sheet"><img id="print-img" alt=""></div>
  <script type="module" src="/js/qr.js"></script>
</body>
</html>
