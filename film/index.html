<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filmen om Husk Klommestein</title>
<meta name="description" content="Sjekklister med bilder, for de stedene der det er lett å glemme noe. Se filmen (1½ minutt).">
<meta property="og:title" content="Husk Klommestein – se filmen">
<meta property="og:description" content="Sjekklister med bilder, for de stedene der det er lett å glemme noe.">
<meta property="og:image" content="https://husk.klommestein.no/film/plakat.jpg">
<meta property="og:type" content="video.other">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { background: #0e2a1e; color: #fff; }
  .film-page {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  .film-page h1 { font-size: 1.5rem; margin: 0 0 14px; }
  .film-page video {
    display: block;
    width: 100%;
    aspect-ratio: 9 / 16;
    max-height: calc(100dvh - 190px);
    margin: 0 auto;
    border-radius: 18px;
    background: #000;
  }
  .film-page p { margin: 16px 0 0; color: #cfe8da; }
  .film-page a { color: #fff; font-weight: 600; }
  .film-page .button { margin-top: 12px; background: #fff; color: #1f6f4a; }
</style>
</head>
<body>
  <main class="film-page">
    <h1>Husk Klommestein på 90 sekunder</h1>
    <video src="/film/husk-klommestein.mp4" poster="/film/plakat.jpg" controls playsinline preload="metadata"></video>
    <p>Tale på engelsk, med norske undertekster.</p>
    <a class="button" href="/om/">Les mer om Husk Klommestein</a>
  </main>
</body>
</html>
