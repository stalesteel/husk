<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Rediger – Husk Klommestein</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/liste.css">
<link rel="stylesheet" href="/css/rediger.css">
</head>
<body class="viewer">
  <header class="topbar">
    <a id="back" class="back" href="/" aria-label="Tilbake">‹</a>
    <span id="list-title" class="topbar-title"></span>
    <span id="save-status" class="save-status" aria-live="polite"></span>
    <span id="counter" class="counter"></span>
    <a id="done" class="topbar-link" href="/">Ferdig</a>
  </header>
  <main id="steps" class="steps" hidden></main>
  <p id="message" class="viewer-message">Et øyeblikk …</p>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <script type="module" src="/js/rediger.js"></script>
</body>
</html>
