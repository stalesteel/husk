<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Husk Klommestein</title>
<link rel="stylesheet" href="/css/base.css">
<style>
  .page { text-align: center; }
  #groups { margin-top: 24px; }
  #new-group { margin-top: 24px; text-align: left; }
  #new-group input { width: 100%; font: inherit; font-size: 1.0625rem; padding: 14px 12px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); }
  #status { margin-top: 32px; }

  /* Adminmodus */
  .admin-toggle { display: inline-flex; gap: 8px; align-items: center; margin-top: 16px; color: var(--muted); }
  .admin-toggle input { width: 20px; height: 20px; accent-color: var(--error); }
  .admin-banner { margin: 24px 0 0; padding: 10px 12px; border-radius: 10px;
    background: var(--error); color: var(--surface); font-weight: 600; }
  .admin-banner a { color: inherit; }
  .admin-list { text-align: left; margin-top: 12px; }
  .admin-row { display: flex; gap: 12px; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border); }
  .admin-row a.name { font-weight: 600; text-decoration: none; color: var(--text); }
  .admin-row small { display: block; color: var(--muted); overflow-wrap: anywhere; }
  .admin-row .edit { flex: none; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <main class="page">
    <h1>Husk Klommestein</h1>
    <p class="muted">Sjekklister med bilder.</p>
    <nav id="groups" aria-label="Mine grupper"></nav>
    <button id="show-new-group" class="button secondary" type="button" hidden>+ Ny gruppe</button>
    <form id="new-group" hidden>
      <input id="new-group-name" type="text" placeholder="Navn, f.eks. «Hytta på Skjeggestad»" aria-label="Navn på gruppen" required>
      <button class="button" type="submit">Lag gruppen</button>
    </form>
    <p id="status" class="muted"></p>
    <label id="admin-toggle" class="admin-toggle" hidden>
      <input id="admin-mode" type="checkbox"> Adminmodus
    </label>
  </main>

  <script type="module">
    import { getUser, hasLinkError } from '/js/auth.js';
    import { adminListGroups, canCreateGroups, createGroup, getMyGroups, isAdmin } from '/js/data.js';
    import { adminModeOn, setAdminMode } from '/js/admin.js';
    import { el } from '/js/dom.js';

    // Invitasjoner lander her. En utløpt lenke sendes videre til innloggingen,
    // som forklarer hva som skjedde.
    if (hasLinkError()) location.replace('/logg-inn/' + location.hash);

    const user = await getUser();
    const status = document.getElementById('status');
    if (user) {
      status.innerHTML = 'Innlogget som <strong></strong> · <a href="/logg-inn/">Konto</a>';
      status.querySelector('strong').textContent = user.email;

      const groupsEl = document.getElementById('groups');
      const [admin, creator] = await Promise.all([isAdmin(), canCreateGroups()]);

      async function renderGroups() {
        if (admin && adminModeOn()) {
          // Alle grupper, med eier og antall lister, for å kunne rydde.
          const all = await adminListGroups().catch(() => []);
          groupsEl.replaceChildren(
            el('p', { class: 'admin-banner' }, `Adminmodus – alle ${all.length} grupper · `,
              el('a', { href: '/admin/' }, 'Brukere og roller')),
            el('div', { class: 'admin-list' }, all.map((group) => el('div', { class: 'admin-row' },
              el('div', {},
                el('a', { class: 'name', href: `/gruppe/?id=${group.id}` }, group.name),
                el('small', {}, `${group.owner_email} · ${group.list_count} ${group.list_count === 1 ? 'liste' : 'lister'}`)),
              el('a', { class: 'edit', href: `/rediger/gruppe/?id=${group.id}` }, 'Rediger')))));
        } else {
          const groups = await getMyGroups(user.id).catch(() => []);
          groupsEl.replaceChildren(...groups.map((group) =>
            el('a', { class: 'button', href: `/gruppe/?id=${group.id}` }, group.name)));
          if (!groups.length) {
            groupsEl.append(el('p', { class: 'muted' }, creator
              ? 'Du har ingen grupper ennå.'
              : 'Du har ingen grupper ennå. Når noen gir deg tilgang til en gruppe, står den her.'));
          }
        }
      }
      await renderGroups();

      if (admin) {
        const toggle = document.getElementById('admin-mode');
        toggle.checked = adminModeOn();
        document.getElementById('admin-toggle').hidden = false;
        toggle.addEventListener('change', () => {
          setAdminMode(toggle.checked);
          renderGroups();
        });
      }

      // Ny gruppe: blir din, og åpnes i redigeringen så du kan legge inn
      // bilde, beskrivelse og lister. Bare for fulle brukere; redaktører
      // redigerer bare grupper de er lagt til i.
      const show = document.getElementById('show-new-group');
      const form = document.getElementById('new-group');
      show.hidden = !creator;
      show.addEventListener('click', () => {
        show.hidden = true;
        form.hidden = false;
        document.getElementById('new-group-name').focus();
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = document.getElementById('new-group-name').value.trim();
        if (!name) return;
        form.querySelector('button').disabled = true;
        try {
          const { id } = await createGroup(name);
          location.assign(`/rediger/gruppe/?id=${id}`);
        } catch {
          form.querySelector('button').disabled = false;
          alert('Kunne ikke lage gruppen. Sjekk nettet og prøv igjen.');
        }
      });
    } else {
      status.innerHTML = '<a href="/logg-inn/">Logg inn</a>';
    }
  </script>
</body>
</html>
