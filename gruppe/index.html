<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Husk Klommestein</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/gruppe.css">
</head>
<body>
  <main class="group">
    <p id="message" class="muted">Et øyeblikk …</p>
    <article id="group" hidden>
      <div class="group-top">
        <a id="home" href="/" hidden>‹ Mine grupper</a>
        <a id="edit" hidden>Rediger gruppen</a>
      </div>
      <h1 id="name"></h1>
      <img id="hero" class="hero" alt="" hidden>
      <p id="description" class="description"></p>
      <nav id="lists" class="lists" aria-label="Sjekklister"></nav>
    </article>
  </main>

  <script type="module">
    import { canEdit } from '/js/admin.js';
    import { getUser } from '/js/auth.js';
    import { getGroup, imageUrl } from '/js/data.js';
    import { el, linkify } from '/js/dom.js';

    const $ = (id) => document.getElementById(id);

    function showMessage(text) {
      $('message').textContent = text;
      $('message').hidden = false;
      $('group').hidden = true;
    }

    let group;
    try {
      group = await getGroup(new URLSearchParams(location.search).get('id'));
    } catch {
      showMessage('Kunne ikke laste siden. Sjekk nettet og prøv igjen.');
    }

    if (group === null) showMessage('Fant ikke denne siden. Sjekk at lenken er riktig.');

    if (group) {
      document.title = `${group.name} – Husk Klommestein`;
      $('name').textContent = group.name;
      $('description').replaceChildren(...linkify(group.description));
      $('description').hidden = !group.description;
      // Innloggede kommer tilbake til gruppene sine. Gjester fra en QR-kode har
      // ingenting å se på forsiden, så de får ikke lenken.
      $('home').hidden = !(await getUser());

      if (canEdit(group)) {
        $('edit').href = `/rediger/gruppe/?id=${group.id}`;
        $('edit').hidden = false;
      }

      // Mangler bildet eller feiler det, vises ingenting i stedet for et ødelagt bilde.
      if (group.image_path) {
        $('hero').addEventListener('error', () => { $('hero').hidden = true; });
        $('hero').src = imageUrl(group.image_path);
        $('hero').hidden = false;
      }

      $('lists').append(...group.lists.map((list) =>
        el('a', { class: 'button', href: `/liste/?id=${list.id}` }, list.title)));
      if (group.lists.length === 0) {
        $('lists').append(el('p', { class: 'muted' }, 'Ingen sjekklister ennå.'));
      }

      $('message').hidden = true;
      $('group').hidden = false;
    }
  </script>
</body>
</html>
